  (click)="themeService.toggle()"
>

    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">

      />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path
        fill="currentColor"
        d="M20.74 14.51a8.5 8.5 0 0 1-11.25-11.25 1 1 0 0 0-1.27-1.3A10.5 10.5 0 1 0 22.04 15.78a1 1 0 0 0-1.3-1.27Z"
      />
    </svg>
  }
</button>
