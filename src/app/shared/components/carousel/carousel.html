<div class="carousel">
  <button
    type="button"
    class="carousel-nav carousel-nav--prev"
    [disabled]="atStart()"
    aria-label="Itens anteriores"
    (click)="scroll(-1)"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path fill="currentColor" d="M15.7 4.3a1 1 0 0 1 0 1.4L9.42 12l6.3 6.3a1 1 0 0 1-1.42 1.4l-7-7a1 1 0 0 1 0-1.4l7-7a1 1 0 0 1 1.42 0Z" />
    </svg>
  </button>

  <div class="product-grid carousel-track" #track (scroll)="updateEdges()">
    <ng-content></ng-content>
  </div>

  <button
    type="button"
    class="carousel-nav carousel-nav--next"
    [disabled]="atEnd()"
    aria-label="Próximos itens"
    (click)="scroll(1)"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path fill="currentColor" d="M8.3 4.3a1 1 0 0 1 1.42 0l7 7a1 1 0 0 1 0 1.4l-7 7a1 1 0 0 1-1.42-1.4l6.3-6.3-6.3-6.3a1 1 0 0 1 0-1.4Z" />
    </svg>
  </button>
</div>
