<a class="product-card card" [routerLink]="['/produtos', product().slug]">
  <div class="product-card-media">
    <img [src]="product().imageUrl || '/images/default.jpg'" [alt]="product().name" />
    @if (product().onSale) {
      <app-badge class="product-card-tag" tone="accent">Promoção</app-badge>
    }
  </div>
  <h3>{{ product().name }}</h3>
  @if (product().reviewCount > 0) {
    <p class="product-card-rating">
      ★ {{ product().averageRating?.toFixed(1) }}
      <span class="product-card-rating-count">({{ product().reviewCount }})</span>
    </p>
  }
  <app-product-price
    [price]="product().price"
    [onSale]="product().onSale"
    [discountPrice]="product().discountPrice"
  />
  @if (product().active && product().stock > 0 && product().stock <= 5) {
    <p class="product-card-low-stock">Últimas {{ product().stock }} unidades!</p>
  }
</a>
