<header class="site-header">
  <div class="site-header-bar container">
    <button
      type="button"
      class="category-toggle"
      [attr.aria-expanded]="categoryMenuOpen()"
      aria-controls="category-nav"
      [attr.aria-label]="categoryMenuOpen() ? 'Fechar categorias' : 'Abrir categorias'"
      (click)="toggleCategoryMenu()"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          fill="currentColor"
          d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"
        />
      </svg>
    </button>

    <a class="brand" routerLink="/">E-commerce</a>

    <a class="cart-toggle" routerLink="/carrinho" aria-label="Carrinho">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path
          fill="currentColor"
          d="M7 4H5v2h2l3.6 7.59-1.35 2.44c-.16.28-.25.61-.25.97 0 1.1.9 2 2 2h12v-2H10.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 23 6H8.42l-.94-2H7ZM11 19.5A2.5 2.5 0 1 0 11 24a2.5 2.5 0 0 0 0-4.5Zm8 0a2.5 2.5 0 1 0 0 4.5 2.5 2.5 0 0 0 0-4.5Z"
        />
      </svg>
      @if (cartService.itemCount() > 0) {
        <span class="cart-count">{{ cartService.itemCount() }}</span>
      }
    </a>
  </div>
</header>

@if (categoryMenuOpen()) {
  <div class="drawer-backdrop" (click)="closeCategoryMenu()">
    <nav
      id="category-nav"
      class="drawer-panel category-drawer"
      aria-label="Categorias"
      (click)="$event.stopPropagation()"
    >
      <div class="drawer-header">
        <h2>Categorias</h2>
        <button type="button" class="drawer-close" aria-label="Fechar categorias" (click)="closeCategoryMenu()">
          &times;
        </button>
      </div>
      <ul>
        <li>
          <a routerLink="/produtos" (click)="closeCategoryMenu()">Todos os produtos</a>
        </li>
        @for (category of categories(); track category.id) {
          <li>
            <a [routerLink]="['/produtos']" [queryParams]="{ category: category.id }" (click)="closeCategoryMenu()">
              {{ category.name }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
}
